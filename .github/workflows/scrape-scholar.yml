name: Scrape Google Scholar Citations

on:
  schedule:
    # Run weekly at 2 AM UTC on Sunday
    - cron: '0 2 * * 0'
  workflow_dispatch:
    # Allow manual triggering
  push:
    branches: [ main ]
    paths:
      - 'scrape_scholar.py'
      - '.github/workflows/scrape-scholar.yml'

jobs:
  scrape-and-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4
        # scholarly uses the bibtexparser 1.x API
        pip install "bibtexparser<2" "free-proxy==1.0.6" git+https://github.com/scholarly-python-package/scholarly.git@develop
        python -c "from scholarly import scholarly, ProxyGenerator; from fp.fp import FreeProxy; import inspect; inspect.signature(FreeProxy.get_proxy_list).bind(None)"
    
    - name: Run Google Scholar scraper (scholarly library)
      timeout-minutes: 6
      env:
        PYTHONUNBUFFERED: 1
      run: |
        echo "Scraping Google Scholar with a 5-minute process deadline"
        if timeout --signal=TERM --kill-after=10s 300s python -u -c "import logging, runpy; from scholarly import scholarly; logging.basicConfig(level=logging.INFO); scholarly.set_timeout(15); scholarly.set_retries(2); runpy.run_path('scrape_scholar.py', run_name='__main__')" hW23VKIAAAAJ; then
          echo "Scraper process completed"
        else
          status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error::Google Scholar scrape exceeded 5 minutes. Existing published data is unchanged."
          else
            echo "::error::Google Scholar scraper failed with exit code $status."
          fi
          exit "$status"
        fi
    
    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    
    - name: Create and switch to google-scholar branch
      run: |
        git fetch origin google-scholar 2>/dev/null || echo "google-scholar branch doesn't exist yet"
        git checkout -b google-scholar 2>/dev/null || git checkout google-scholar
    
    - name: Check for changes
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Commit and push to google-scholar branch
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git add gs_data.json
        git commit -m "Update Google Scholar citations data - $(date +'%Y-%m-%d %H:%M:%S')"
        
        # Try different push strategies
        git push origin google-scholar --force-with-lease || {
          echo "Force-with-lease failed, trying regular push..."
          git push origin google-scholar || {
            echo "Regular push failed, trying to set upstream and push..."
            git push --set-upstream origin google-scholar || {
              echo "All push attempts failed. Check repository permissions."
              echo "Data was successfully generated but could not be pushed."
              exit 1
            }
          }
        }
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: scholar-data
        path: gs_data.json
        retention-days: 30
